<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tech-platform-vue</title>
    <script>
      try {
        const storedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = storedTheme === 'light' || storedTheme === 'dark'
          ? storedTheme
          : (systemPrefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <style>
      /* 首屏加载指示器 - JS hydrate 完成后自动消失 */
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-primary, #f8fafc);
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      [data-theme=\"dark\"] .app-loader {
        background: var(--bg-primary, #0d0518);
      }
      .app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border-primary, #e2e8f0);
        border-top-color: var(--accent-primary, #6366f1);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .app-loader-text {
        margin-top: 16px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: var(--text-tertiary, #94a3b8);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loader" id="app-loader">
        <div class="app-loader-spinner"></div>
        <div class="app-loader-text">加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
